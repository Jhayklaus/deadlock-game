# Keeps the realtime relay from going to sleep.
#
# Free hosting tiers spin a service down after a quiet spell, and the next
# player to open a room waits out a cold start — ten seconds or more of a
# screen that looks broken. The app now says "Waking the server" during that
# window, but not waiting at all is better.
#
# Opt-in: set a repository variable named RELAY_HEALTH_URL to the relay's
# health endpoint (e.g. https://your-service.onrender.com/api/health). With no
# variable set this does nothing, so the workflow is safe to leave in place.
#
# A paid tier that never sleeps is the alternative, and the better answer if
# the game gets real use.
name: Keep the relay warm

on:
  schedule:
    # Every 10 minutes. Free tiers typically sleep after 15 minutes idle, and
    # GitHub's scheduler can run late, so the margin is deliberate.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the relay
        env:
          URL: ${{ vars.RELAY_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RELAY_HEALTH_URL is not set — nothing to ping. See this file's header."
            exit 0
          fi
          # A cold start can take a while, so allow for it rather than failing.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo "000")
          echo "$URL -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Relay health check returned $code"
          fi
